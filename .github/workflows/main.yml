name: Build and Deploy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. دریافت کد پروژه
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. نصب Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. نصب وابستگی‌های سیستم Android/Buildozer
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # 4. نصب Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython
          pip install kivy plyer

      # 5. ساخت APK
      - name: Build APK
        run: |
          buildozer android debug

      # 6. پیدا کردن APK ساخته‌شده
      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      # 7. آپلود APK به عنوان Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: torchlight-debug-apk
          path: |
            bin/*.apk
            torchlight/bin/*.apk
          if-no-files-found: error

      # 8. ساخت GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "v1.0-${{ github.sha }}"
          name: "Torch Light – Debug Build"
          body: |
            APK ساخته شده به‌صورت خودکار توسط GitHub Actions.

            Commit:
            ${{ github.sha }}
          files: |
            bin/*.apk
            torchlight/bin/*.apk
          prerelease: true
