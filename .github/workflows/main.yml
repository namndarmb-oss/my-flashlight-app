:.github/workflows/build_apk.yml
name: Build and Deploy APK

# اجرا شدن وقتی کد به شاخهٔ main پوش می‌شود
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ دریافت کد منبع
      - name: Checkout repository
        uses: actions/checkout@v2

      # 2️⃣ نصب Python (نسخه 3.9)
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      # 3️⃣ نصب وابستگی‌های Buildozer، Kivy و Plyer
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install kivy plyer

      # 4️⃣ ساخت APK (حالت debug)
      - name: Build APK
        run: |
          # Buildozer به‌صورت پیش‌فرض در پوشهٔ ریشهٔ پروژه اجرا می‌شود
          buildozer android debug

      # 5️⃣ بارگذاری APK به‌عنوان artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v2
        with:
          name: torchlight-debug.apk
          path: torchlight/bin/torchlight-1.0-debug.apk

      # 6️⃣ ایجاد/به‌روزرسانی Release و افزودن APK به آن
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.0-${{ github.sha }}"
          name: "Torch Light – Debug Build"
          body: |
            APK ساخته شده به‌صورت خودکار توسط GitHub Actions.
            SHA: ${{ github.sha }}
          artifacts: torchlight/bin/torchlight-1.0-debug.apk
          draft: false
          prerelease: true
