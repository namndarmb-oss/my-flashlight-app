name: Build and Release Luxury APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          # ensure add-apt-repository is available and enable 'universe' (needed for libunwind-dev)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update

          # install core dependencies (install libunwind-dev explicitly to satisfy libgstreamer1.0-dev)
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev libsqlite3-dev lzip unzip git zip curl build-essential pkg-config

          # multimedia / dev libs
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev

          # gstreamer and plugins
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools

          # attempt to fix any broken deps
          sudo apt-get -f install -y || true

          # python packages
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy kivymd plyer

      - name: Install Android SDK command-line tools and Build Tools
  run: |
    set -euo pipefail
    export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
    mkdir -p "$ANDROID_SDK_ROOT"
    # download command-line tools (URL ممکن است در آینده نیاز به آپدیت داشته باشد)
    wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
    unzip -q /tmp/cmdline.zip -d /tmp/cmdline-tools
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
    # قبول کردن licenseها و نصب platform-tools، پلتفرم و build-tools
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
    # بررسی اینکه aidl نصب شده
    if [ ! -f "$ANDROID_SDK_ROOT/build-tools/33.0.2/aidl" ]; then
      echo "aidl not found; listing build-tools dir:"
      ls -la "$ANDROID_SDK_ROOT/build-tools" || true
      exit 1
    fi

      - name: Build APK with Buildozer
        run: |
          set -euo pipefail
          export ACCEPT_LICENSES="y"
          export PATH="$HOME/.local/bin:$PATH"

          # verbose build so logs help debugging
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "y"

      - name: List APKs
        run: |
          echo "Looking for APKs in $(pwd)/bin"
          ls -la bin || true

      - name: Get Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: "Luxury Torch Build ${{ steps.date.outputs.date }}"
          files: bin/*.apk
          body: "فایل APK چراغ‌قوه لوکس پایتون با موفقیت ساخته شد."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
