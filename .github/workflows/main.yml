name: Build and Release Luxury APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          # ensure add-apt-repository is available and enable 'universe' (needed for libunwind-dev)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update

          # install core dependencies (install libunwind-dev explicitly to satisfy libgstreamer1.0-dev)
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev libsqlite3-dev lzip unzip git zip curl build-essential pkg-config

          # multimedia / dev libs
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev

          # gstreamer and plugins
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools

          # attempt to fix any broken deps
          sudo apt-get -f install -y || true

          # python packages
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy kivymd plyer

      - name: Install Android SDK command-line tools and build-tools
        run: |
          set -euo pipefail

          # Local SDK path
          ANDROID_HOME="$HOME/android-sdk"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$HOME"

          # download command-line tools (update version URL if needed)
          curl -sSLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip -d cmdline-tools-tmp

          # sdkmanager expects cmdline-tools/latest
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools-tmp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          rm -rf commandlinetools.zip cmdline-tools-tmp

          # make sdkmanager available in this step
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          # accept licenses and install required packages
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          # publish env for subsequent steps
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

      - name: Build APK with Buildozer
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # accept licenses automatically via buildozer env
          export APP_ANDROID_ACCEPT_SDK_LICENSE="1"
          
          # verbose build so logs help debugging
          buildozer -v android debug

      - name: List APKs
        run: |
          echo "Looking for APKs in $(pwd)/bin"
          ls -la bin || true

      - name: Get Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: "Luxury Torch Build ${{ steps.date.outputs.date }}"
          files: bin/*.apk
          body: "فایل APK چراغ‌قوه لوکس پایتون با موفقیت ساخته شد."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
