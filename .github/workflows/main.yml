name: Build and Release Luxury APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Buildozer به طور پیش‌فرض SDK را زیر $HOME/.buildozer/android/platform/android-sdk قرار می‌دهد.
      ANDROID_HOME: ${{ runner.home }}/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.home }}/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl zip openjdk-11-jdk

      - name: Install Java (Temurin 11) for tooling
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK command-line tools + sdkmanager
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"
          cd "${HOME}"

          # دانلود commandline tools (نسخه ممکن است در آینده تغییر کند - اگر لازم شد نسخه جدید را جایگزین کنید)
          CLI_ZIP="commandlinetools-linux-latest.zip"
          curl -fLo "${CLI_ZIP}" "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"

          mkdir -p cmdline-tools-temp
          unzip -q "${CLI_ZIP}" -d cmdline-tools-temp

          # قرار دادن در مسیر مورد انتظار buildozer: <SDK_ROOT>/cmdline-tools/latest
          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
          # بعضی zipها پوشه cmdline-tools/ دارند؛ سازگار کردن با هر دو حالت
          if [ -d cmdline-tools-temp/cmdline-tools ]; then
            mv cmdline-tools-temp/cmdline-tools/* "${SDK_ROOT}/cmdline-tools/latest/"
          else
            mv cmdline-tools-temp/* "${SDK_ROOT}/cmdline-tools/latest/"
          fi

          rm -rf cmdline-tools-temp "${CLI_ZIP}"

          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"

          # اطمینان از وجود sdkmanager و پذیرش لایسنس‌ها
          yes | sdkmanager --sdk_root="${SDK_ROOT}" --licenses || true

          # نصب بسته‌های پایه (ویرژن‌ها را بر اساس نیاز پروژه‌تان تنظیم کنید)
          sdkmanager --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;31.0.0" || {
            echo "sdkmanager install failed; printing diagnostics"
            echo "=== sdkmanager --version ==="
            sdkmanager --version || true
            echo "=== SDK root contents ==="
            ls -la "${SDK_ROOT}" || true
            exit 1
          }

      - name: Ensure PATH contains sdkmanager for subsequent steps
        run: |
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> $GITHUB_PATH

      - name: Install/Upgrade pip & Buildozer deps
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: (Optional) Show SDK layout for debug
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls -la "${ANDROID_HOME}"
          ls -la "${ANDROID_HOME}/cmdline-tools"
          ls -la "${ANDROID_HOME}/cmdline-tools/latest/bin" || true

      - name: Build with Buildozer (debug)
        working-directory: .
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          # اگر buildozer.spec در ریشه نیست مسیر مناسب را قرار دهید
          buildozer -v android debug
