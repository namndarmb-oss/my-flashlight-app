name: Build and Release Luxury APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          # ensure add-apt-repository is available and enable 'universe' (needed for libunwind-dev)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update

          # install core dependencies (install libunwind-dev explicitly to satisfy libgstreamer1.0-dev)
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev libsqlite3-dev lzip unzip git zip curl build-essential pkg-config

          # multimedia / dev libs
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev

          # gstreamer and plugins
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools

          # attempt to fix any broken deps
          sudo apt-get -f install -y || true

          # python packages
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy kivymd plyer

      - name: Install Android SDK command-line tools and build-tools
        run: |
          set -euo pipefail

          # Local SDK path
          ANDROID_HOME="$HOME/android-sdk"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$HOME"

          # download command-line tools (update version URL if needed)
          CLI_ZIP_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          curl -sSLo commandlinetools.zip "$CLI_ZIP_URL"
          unzip -q commandlinetools.zip -d cmdline-tools-tmp

          # sdkmanager expects cmdline-tools/latest
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools-tmp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          rm -rf commandlinetools.zip cmdline-tools-tmp

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"

          # Ensure Java location explicit for sdkmanager (setup-java previously installed Java)
          # If setup-java exported JAVA_HOME already, this preserves it; otherwise default is used.
          : "${JAVA_HOME:=/usr/lib/jvm/java-17-openjdk-amd64}"
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          export JAVA_HOME="$JAVA_HOME"

          # publish env for subsequent steps
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$ANDROID_HOME/cmdline-tools/latest/bin:$HOME/.local/bin:$PATH" >> $GITHUB_ENV

          # Accept licenses (ignore non-zero exit here since sdkmanager sometimes returns non-zero even when done)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          # Install packages with retries and a --no_https fallback
          PACKAGES=("platform-tools" "platforms;android-33" "build-tools;33.0.2")
          MAX_TRIES=3
          for try in $(seq 1 $MAX_TRIES); do
            echo "sdkmanager install attempt $try"
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "${PACKAGES[@]}"; then
              echo "sdkmanager install succeeded"
              break
            fi
            echo "sdkmanager install failed on attempt $try"
            if [ "$try" -lt "$MAX_TRIES" ]; then
              echo "Retrying in 10s..."
              sleep 10
            else
              echo "Trying last resort with --no_https"
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --no_https "${PACKAGES[@]}" || {
                echo "ERROR: sdkmanager failed to install required packages"
                exit 1
              }
            fi
          done

          # Diagnostics
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list_installed || true
          ls -la "$ANDROID_HOME" || true

      - name: Build APK with Buildozer
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # accept licenses automatically via buildozer env
          export APP_ANDROID_ACCEPT_SDK_LICENSE="1"
          
          # verbose build so logs help debugging
          buildozer -v android debug

      - name: List APKs
        run: |
          echo "Looking for APKs in $(pwd)/bin"
          ls -la bin || true

      - name: Get Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: "Luxury Torch Build ${{ steps.date.outputs.date }}"
          files: bin/*.apk
          body: "فایل APK چراغ‌قوه لوکس پایتون با موفقیت ساخته شد."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
