name: Build Luxury Torch APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache Buildozer
      uses: actions/cache@v3
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          python3-dev \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-0 \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libjpeg-dev \
          libpng-dev \
          libtiff-dev \
          libfreetype6-dev \
          libncurses5-dev \
          libncursesw5-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zip \
          unzip \
          openjdk-17-jdk
    
    - name: Upgrade pip and install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify installed packages
      run: |
        pip list
        python -c "import kivy; print('Kivy version:', kivy.__version__)"
        python -c "import kivymd; print('KivyMD version:', kivymd.__version__)"
        python -c "import plyer; print('Plyer imported successfully')"
    
    - name: Build APK with Buildozer
      run: |
        buildozer android debug
    
    - name: List generated files
      run: |
        echo "Listing bin directory:"
        ls -la bin/ || echo "bin directory not found"
        echo "Listing current directory:"
        ls -la
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: luxury-torch-apk
        path: |
          bin/*.apk
          *.apk
        retention-days: 30
    
    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          bin/*.apk
          *.apk
        tag_name: v${{ github.run_number }}
        name: Luxury Torch v${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
