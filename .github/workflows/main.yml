name: Android Build (Buildozer)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_API: 33
      ANDROID_BUILD_TOOLS: 33.0.2
      ANDROID_MIN_API: 21
      ANDROID_NDK_VERSION: 25.2.9519653
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system packages (autotools, dev libs, build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl unzip wget ca-certificates pkg-config \
            autoconf automake libtool libtool-bin autopoint gettext \
            libffi-dev libgdbm-dev libsqlite3-dev tk-dev libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libncurses5-dev libncurses-dev liblzma-dev \
            libdb5.3-dev python3-venv python3-dev openjdk-11-jdk-headless

      - name: Set up Java (Temurin 11)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK commandline tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          curl -fSL "$SDK_URL" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-temp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/
          rm -rf cmdline-tools-temp cmdline-tools.zip

      - name: Export Android environment variables
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install Android packages (platforms, build-tools, ndk)
        env:
          ANDROID_API: ${{ env.ANDROID_API }}
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_BUILD_TOOLS }}
          ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -e
          yes | sdkmanager --licenses || true

          echo "Listing available remote packages (filtered for ndk):"
          sdkmanager --list | sed -n '1,200p' | grep -E 'ndk;|ndk-bundle' || true

          REQUESTED="ndk;${ANDROID_NDK_VERSION}"
          FALLBACK="ndk;25.2.9519653"

          if sdkmanager --list | grep -q "${REQUESTED}"; then
            echo "Installing ${REQUESTED}"
            sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}" "${REQUESTED}" "cmdline-tools;latest"
            echo "ANDROID_NDK_VERSION=${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          else
            echo "Requested ${REQUESTED} not found. Falling back to ${FALLBACK}"
            sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}" "${FALLBACK}" "cmdline-tools;latest"
            echo "ANDROID_NDK_VERSION=${FALLBACK#ndk;}" >> $GITHUB_ENV
          fi

      - name: Ensure user local bin in PATH and install Python tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user --upgrade buildozer cython virtualenv
          python3 -m pip install --user --upgrade python-for-android
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Cache buildozer and pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.local
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}

      - name: Show environment (debug)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "PATH=$PATH"
          sdkmanager --list || true

      - name: Build APK with Buildozer
        env:
          ANDROIDNDK: $HOME/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROIDSDK: $HOME/android-sdk
          ANDROID_HOME: $HOME/android-sdk
        run: |
          set -e
          # Optional clean to avoid stale state:
          ~/.local/bin/buildozer -v android debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            **/*.apk
